name: release

on:
  workflow_dispatch:
  push:
    branches:
      - release
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS Apple Silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS Intel
          - platform: ubuntu-22.04
            args: ""
            name: Linux x64
          - platform: windows-latest
            args: ""
            name: Windows x64

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Aaron Grace, M.Ed. v__VERSION__"
          releaseBody: |
            Desktop release of **Aaron Grace, M.Ed.** — Ellucian Banner, PowerFAIDS, disability support, Amazon textbooks, Rate My Professor, and the world college directory.

            ### Downloads by platform
            | Platform | Grab |
            | -------- | ---- |
            | macOS Apple Silicon | `.dmg` (`aarch64`) |
            | macOS Intel | `.dmg` (`x64`) |
            | Windows | `.msi` / `.exe` |
            | Linux | `.AppImage` (recommended) / `.deb` / `.rpm` |
            | Steam Deck | Linux `.AppImage` + `scripts/steam-deck-konsole.sh` |

            Full guide: `DOWNLOADS.md` in the repo.

            ### Steam Deck (Konsole)
            ```bash
            bash scripts/steam-deck-konsole.sh
            # private repo:
            GH_TOKEN=... bash scripts/steam-deck-konsole.sh
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
