[package]
name = "aaron-grace-med"
version = "1.1.0"
description = "Aaron Grace, M.Ed. — ultimate college toolkit"
authors = ["Aaron Grace, M.Ed."]
edition = "2021"

[lib]
name = "aaron_grace_med_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
